name: Test failOnWarnings option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create commitlint config with warning rule
        run: |
          cat > commitlint.config.mjs << 'EOF'
          export default {
            extends: ['@commitlint/config-conventional'],
            rules: {
              'body-max-line-length': [1, 'always', 72],
            },
          };
          EOF

      - name: Set up a commit that passes but may trigger warnings
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "warnings-test" > test-warnings.txt
          git add test-warnings.txt commitlint.config.mjs
          git commit -m "feat: add warnings test file"

      - id: action
        uses: .
        with:
          configFile: ./commitlint.config.mjs
          failOnErrors: "true"
          failOnWarnings: "false"
          commitDepth: "1"

      - name: Assert action succeeded with failOnWarnings false
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          if [ -z "$RESULTS" ]; then
            echo "FAIL: expected results output to be non-empty"
            exit 1
          fi
          echo "PASS: action completed with failOnWarnings=false"
