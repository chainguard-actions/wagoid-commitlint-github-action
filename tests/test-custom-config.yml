name: Test custom config file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      # Create a custom commitlint config file
      - name: Create custom commitlint config
        run: |
          cat > commitlint.config.mjs << 'EOF'
          export default {
            rules: {
              'type-enum': [2, 'always', ['feat', 'fix', 'chore', 'docs', 'test']],
              'type-empty': [2, 'never'],
              'subject-empty': [2, 'never'],
            },
          };
          EOF

      # Create a valid commit using one of the allowed types
      - name: Setup git and create a valid commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          touch tests-temp-custom-config.txt
          git add tests-temp-custom-config.txt
          git commit -m "chore: add test file for custom config"

      - id: action
        uses: .
        with:
          configFile: ./commitlint.config.mjs
          commitDepth: "1"
          failOnErrors: "true"
          failOnWarnings: "false"

      - name: Assert action succeeded with custom config
        env:
          RESULTS: ${{ steps.action.outputs.results }}
        run: |
          echo "results: $RESULTS"
          echo "PASS: action completed successfully with custom config file"
